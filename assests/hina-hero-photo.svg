<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">Hina Sadaf | Full-Stack Developer</title>
  <desc id="desc">Developer banner with animated profile avatar, rotating cyber rings, and glowing neon accents.</desc>

  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0307"/>
      <stop offset="35%" stop-color="#240715"/>
      <stop offset="70%" stop-color="#420d24"/>
      <stop offset="100%" stop-color="#12040c"/>
    </linearGradient>

    <!-- Neon Text and Accent Gradient -->
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Nebula Glow -->
    <radialGradient id="nebulaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#be185d" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#be185d" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#f472b6" stroke-opacity="0.08" stroke-width="0.8"/>
      <circle cx="30" cy="0" r="0.75" fill="#f472b6" fill-opacity="0.25"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="7" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="roundedFrame">
      <rect width="900" height="320" rx="20"/>
    </clipPath>

    <!-- PROFILE IMAGE CIRCULAR CLIP PATH -->
    <clipPath id="avatarClip">
      <circle cx="0" cy="0" r="54"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedFrame)">
    <!-- Base Background and Grid -->
    <rect width="900" height="320" fill="url(#bgGradient)"/>
    <rect width="900" height="320" fill="url(#cyberGrid)"/>

    <!-- Nebula Glow behind Avatar -->
    <ellipse cx="735" cy="145" rx="260" ry="210" fill="url(#nebulaGlow)">
      <animate attributeName="cx" values="715;755;715" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="135;160;135" dur="7s" repeatCount="indefinite"/>
    </ellipse>

    <!-- Dynamic Wavy Light Beams -->
    <path d="M-80 250 Q 200 80 430 230 T 980 90" fill="none" stroke="#f43f5e" stroke-opacity="0.2" stroke-width="1.5">
      <animate attributeName="d"
        values="M-80 250 Q 200 80 430 230 T 980 90;
                M-80 180 Q 200 280 430 110 T 980 170;
                M-80 250 Q 200 80 430 230 T 980 90"
        dur="14s" repeatCount="indefinite"/>
    </path>

    <!-- Neon Light Stream -->
    <path d="M-100 280 Q 220 120 460 270 T 1000 110" fill="none" stroke="url(#neonGradient)" stroke-opacity="0.7" stroke-width="2.5" stroke-dasharray="90 850" filter="url(#softGlow)">
      <animate attributeName="stroke-dashoffset" values="940;0" dur="5s" repeatCount="indefinite"/>
    </path>

    <!-- Background Stars and Particles -->
    <g fill="#fecdd3">
      <path d="M220 50 Q220 60 230 60 Q220 60 220 70 Q220 60 210 60 Q220 60 220 50" fill="#ffffff" opacity="0.6">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
      </path>
      <circle cx="85" cy="85" r="1.5">
        <animate attributeName="cy" values="85;65;85" dur="3.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="410" cy="50" r="2">
        <animate attributeName="cy" values="50;75;50" dur="4.2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="840" cy="265" r="2.5" filter="url(#softGlow)">
        <animate attributeName="r" values="1.8;3.5;1.8" dur="2.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- LEFT TEXT CONTENT -->
    <g transform="translate(55, 38)">
      <rect width="186" height="26" rx="13" fill="#be185d" fill-opacity="0.18" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1"/>
      <circle cx="16" cy="13" r="4" fill="#22c55e"/>
      <circle cx="16" cy="13" r="4" fill="none" stroke="#22c55e" stroke-width="1.5" opacity="0.8">
        <animate attributeName="r" values="4;10" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.8;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="28" y="17" fill="#fbcfe8" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="1.2">AVAILABLE FOR WORK</text>
    </g>

    <g transform="translate(53, 126)">
      <text x="0" y="0" fill="url(#neonGradient)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" filter="url(#neonGlow)">
        Hina Sadaf
      </text>
    </g>

    <g transform="translate(55, 142)">
      <rect x="0" y="0" width="250" height="2.5" rx="1.5" fill="#4a0e24"/>
      <rect x="0" y="0" width="180" height="2.5" rx="1.5" fill="url(#neonGradient)">
        <animate attributeName="width" values="40;250;180;250" dur="6s" repeatCount="indefinite"/>
      </rect>
      <circle cx="0" cy="1.2" r="3.5" fill="#ffffff" filter="url(#softGlow)">
        <animate attributeName="cx" values="0;250;0" dur="6s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g font-family="system-ui, -apple-system, sans-serif" transform="translate(55, 175)">
      <text x="0" y="0" fill="#fbcfe8" font-size="15" font-weight="500">Computer Science Student</text>
      <text x="0" y="24" fill="#ffffff" font-size="17" font-weight="700">Full-Stack Web Developer</text>
    </g>

    <!-- Tech Badges -->
    <g transform="translate(55, 230)">
      <g transform="translate(0, 0)">
        <rect width="82" height="26" rx="6" fill="url(#pillGrad)" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#61dafb" filter="url(#softGlow)"/>
        <text x="21" y="17" fill="#fdf2f8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">React</text>
      </g>
      <g transform="translate(90, 0)">
        <rect width="80" height="26" rx="6" fill="url(#pillGrad)" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#ffffff"/>
        <text x="21" y="17" fill="#fdf2f8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">Next.js</text>
      </g>
      <g transform="translate(178, 0)">
        <rect width="80" height="26" rx="6" fill="url(#pillGrad)" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#68a063"/>
        <text x="21" y="17" fill="#fdf2f8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">Node.js</text>
      </g>
      <g transform="translate(266, 0)">
        <rect width="98" height="26" rx="6" fill="url(#pillGrad)" stroke="#f472b6" stroke-opacity="0.35" stroke-width="1"/>
        <circle cx="12" cy="13" r="3" fill="#3178c6"/>
        <text x="21" y="17" fill="#fdf2f8" font-family="'Fira Code', monospace" font-size="11" font-weight="600">JavaScript</text>
      </g>
    </g>

    <g transform="translate(55, 288)">
      <text fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" letter-spacing="3.5">
        LEARN  •  BUILD  •  SCALE  •  INNOVATE
      </text>
    </g>

    <!-- RIGHT SIDE: AVATAR AND CYBER RINGS -->
    <g transform="translate(735, 145)">
      <!-- Outer Tech Rings -->
      <circle r="115" fill="none" stroke="#be185d" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="6 6"/>

      <!-- Clockwise Segmented Ring -->
      <circle r="95" fill="none" stroke="#f472b6" stroke-opacity="0.45" stroke-width="1.8" stroke-dasharray="14 35 60 25">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>

      <!-- Counter-Clockwise Dotted Ring -->
      <circle r="75" fill="none" stroke="#fecdd3" stroke-opacity="0.6" stroke-width="1.2" stroke-dasharray="4 8">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="24s" repeatCount="indefinite"/>
      </circle>

      <!-- 3D Orbiting Ellipse -->
      <ellipse rx="108" ry="40" fill="none" stroke="#fda4af" stroke-opacity="0.55" stroke-width="1.5" transform="rotate(-28)">
        <animateTransform attributeName="transform" type="rotate" from="-28" to="332" dur="14s" repeatCount="indefinite"/>
      </ellipse>

      <!-- Orbiting Satellite -->
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="6s" repeatCount="indefinite"/>
        <circle cx="95" cy="0" r="4.5" fill="#ffffff" filter="url(#neonGlow)"/>
        <circle cx="95" cy="0" r="2" fill="#be185d"/>
      </g>

      <!-- Background Behind Avatar -->
      <circle r="55" fill="#240715"/>

      <!-- PROFILE IMAGE (FIXED PROPER SVG TAG) -->
      <g clip-path="url(#avatarClip)">
        <image 
          xlink:href="./github%20images.png" 
          href="./github%20images.png" 
          x="-55" y="-55" 
          width="110" height="110" 
          preserveAspectRatio="xMidYMid slice"
        />
      </g>

      <!-- Glowing Neon Border around Avatar -->
      <circle r="55" fill="none" stroke="url(#neonGradient)" stroke-width="2.5" filter="url(#softGlow)">
        <animate attributeName="stroke-opacity" values="0.7;1;0.7" dur="3s" repeatCount="indefinite"/>
      </circle>

      <!-- Small floating dev badge on the avatar corner -->
      <g transform="translate(32, 32)">
        <circle r="14" fill="#18040f" stroke="#f472b6" stroke-width="1.5"/>
        <text x="-8" y="4" font-family="'Fira Code', monospace" font-size="10" font-weight="700" fill="#fbcfe8">&lt;/&gt;</text>
      </g>
    </g>

    <!-- Outer Border -->
    <rect x="1" y="1" width="898" height="318" rx="19" fill="none" stroke="#be185d" stroke-opacity="0.5" stroke-width="1.5"/>
    <rect x="1" y="1" width="898" height="318" rx="19" fill="none" stroke="url(#neonGradient)" stroke-opacity="0.8" stroke-width="2" stroke-dasharray="140 760">
      <animate attributeName="stroke-dashoffset" values="900;0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
