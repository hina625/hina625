<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hina Sadaf — Photo Hero</title>
  <desc id="desc">Hero that uses a background photo. Replace 'assests/hina-photo.jpg' with your actual photo in the repo.</desc>

  <defs>
    <linearGradient id="bg_photo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0710" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1b0a12" stop-opacity="0.6"/>
    </linearGradient>
    <clipPath id="frame_photo"><rect width="1200" height="360" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame_photo)">
    <!-- photo (add assests/hina-photo.jpg to repo) -->
    <image href="assests/hina-photo.jpg" x="0" y="0" width="1200" height="360" preserveAspectRatio="xMidYCenter slice"/>

    <!-- dark overlay -->
    <rect width="1200" height="360" fill="url(#bg_photo)"/>

    <!-- soft neon accent -->
    <ellipse cx="980" cy="90" rx="260" ry="150" fill="#c77b9b" opacity="0.08"/>

    <!-- name block -->
    <foreignObject x="48" y="90" width="560" height="180">
      <body xmlns="http://www.w3.org/1999/xhtml" style="font-family: Inter, Arial, sans-serif; color: #fff;">
        <div style="padding:12px 18px; backdrop-filter: blur(6px);">
          <h1 style="margin:0; font-size:48px; line-height:1;">Hina Sadaf</h1>
          <p style="margin:6px 0 0; color:#e9d8df; font-size:16px;">Full‑Stack Web Developer — Computer Science</p>
        </div>
      </body>
    </foreignObject>

    <!-- frame -->
    <rect x="6" y="6" width="1188" height="348" rx="20" fill="none" stroke="#e5b5c7" stroke-opacity="0.28"/>
  </g>
</svg>