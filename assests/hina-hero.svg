<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hina Sadaf — Premium</title>
  <desc id="desc">Premium luxury hero: deep burgundy with gold accents and slow, elegant animations.</desc>

  <defs>
    <linearGradient id="bg_premium" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0507"/>
      <stop offset="45%" stop-color="#3b0f17"/>
      <stop offset="100%" stop-color="#14060a"/>
    </linearGradient>

    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff7ea" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#ffd89a" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#b6874a" stop-opacity="0.0"/>
    </radialGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame_premium"><rect width="1200" height="360" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#frame_premium)">
    <rect width="1200" height="360" fill="url(#bg_premium)"/>

    <ellipse cx="980" cy="90" rx="260" ry="160" fill="url(#gold)" opacity="0.18">
      <animate attributeName="cx" values="960;1000;960" dur="16s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.22;0.12" dur="14s" repeatCount="indefinite"/>
    </ellipse>

    <path d="M40 280 C300 120 560 200 1160 60" fill="none" stroke="#b69155" stroke-width="1.2" opacity="0.16"/>

    <g fill="#F4E9C8" opacity="0.85">
      <circle cx="110" cy="70" r="2.4"><animate attributeName="cy" values="70;50;70" dur="4.5s" repeatCount="indefinite"/></circle>
      <circle cx="420" cy="95" r="2.6"><animate attributeName="cy" values="95;115;95" dur="5.2s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="220" r="2.2"><animate attributeName="r" values="1.6;3.2;1.6" dur="3.8s" repeatCount="indefinite"/></circle>
    </g>

    <text x="60" y="120" fill="#f7efe7" font-family="Georgia, serif" font-size="48" font-weight="700" filter="url(#soft)">Hina Sadaf</text>

    <text x="60" y="158" fill="#d7c2a1" font-family="Georgia, serif" font-size="18">Computer Science Student • Full‑Stack Developer</text>

    <rect x="60" y="178" width="320" height="2" rx="1" fill="#b69155" opacity="0.95">
      <animate attributeName="width" values="0;320;280;320" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g transform="translate(980 138)">
      <circle r="84" fill="none" stroke="#b69155" stroke-width="1.6" opacity="0.22"/>
      <circle r="56" fill="none" stroke="#f7efe7" stroke-width="1.1" opacity="0.12"/>
      <text x="-28" y="12" font-family="serif" font-size="34" fill="#f7efe7">&lt;/&gt;</text>
    </g>

    <rect x="8" y="8" width="1184" height="344" rx="26" fill="none" stroke="#b69155" stroke-opacity="0.35"/>
  </g>
</svg>
