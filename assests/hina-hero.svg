<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-labelledby="title desc">
  <title id="title">Hina Sadaf - Developer</title>
  <desc id="desc">Animated burgundy developer banner with glowing effects and moving geometric elements.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F060C"/>
      <stop offset="52%" stop-color="#451126"/>
      <stop offset="100%" stop-color="#160B12"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C77B9B" stop-opacity="0"/>
      <stop offset="50%" stop-color="#F8E8EF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E5A4C3" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#C72F70" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#C72F70" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#F2D9E4" stroke-opacity="0.1" stroke-width="0.8"/>
    </pattern>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="frame">
      <rect width="900" height="280" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#grid)"/>

    <circle cx="735" cy="110" r="155" fill="url(#glow)">
      <animate attributeName="cx" values="700;790;700" dur="12s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;150;90" dur="9s" repeatCount="indefinite"/>
    </circle>

    <path d="M-80 220 Q170 90 360 205 T980 80" fill="none" stroke="#C77B9B" stroke-opacity="0.25" stroke-width="1.5">
      <animate attributeName="d" values="M-80 220 Q170 90 360 205 T980 80;M-80 165 Q170 255 360 120 T980 150;M-80 220 Q170 90 360 205 T980 80" dur="12s" repeatCount="indefinite"/>
    </path>

    <path d="M-100 250 Q200 120 430 245 T1000 110" fill="none" stroke="url(#neon)" stroke-width="2.2" stroke-dasharray="80 800" stroke-linecap="round" opacity="0.9">
      <animate attributeName="stroke-dashoffset" values="880;0" dur="6.5s" repeatCount="indefinite"/>
    </path>

    <g fill="#F7D4E2" opacity="0.9">
      <circle cx="90" cy="60" r="2.2">
        <animate attributeName="cy" values="60;42;60" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite"/>
      </circle>
      <circle cx="420" cy="75" r="2.6">
        <animate attributeName="cy" values="75;95;75" dur="4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="530" cy="225" r="2.2">
        <animate attributeName="cy" values="225;205;225" dur="3.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="820" cy="230" r="3">
        <animate attributeName="r" values="2;4.5;2" dur="2.5s" repeatCount="indefinite"/>
      </circle>
      <circle cx="360" cy="48" r="1.8">
        <animate attributeName="cy" values="48;68;48" dur="3.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="610" cy="50" r="2.1">
        <animate attributeName="cy" values="50;34;50" dur="4.2s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g transform="translate(740 110)">
      <circle r="110" fill="none" stroke="#C77B9B" stroke-opacity="0.28" stroke-width="1"/>
      <circle r="82" fill="none" stroke="#E5B5C7" stroke-opacity="0.55" stroke-width="1.5" stroke-dasharray="4 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="28s" repeatCount="indefinite"/>
      </circle>
      <circle r="58" fill="none" stroke="#C77B9B" stroke-opacity="0.7" stroke-width="1.2"/>
      <ellipse rx="104" ry="36" fill="none" stroke="#E5B5C7" stroke-opacity="0.55" transform="rotate(-35)">
        <animateTransform attributeName="transform" type="rotate" from="-35" to="325" dur="16s" repeatCount="indefinite"/>
      </ellipse>
      <circle cx="85" cy="-46" r="5" fill="#FFF0F6" filter="url(#softGlow)">
        <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-57" cy="35" r="3" fill="#C77B9B">
        <animate attributeName="cy" values="35;24;35" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text x="-40" y="11" font-family="monospace" font-size="34" fill="#E5B5C7" opacity="0.9">&lt;/&gt;</text>
    </g>

    <g>
      <text x="55" y="76" fill="#E5B5C7" font-family="Arial, sans-serif" font-size="15" letter-spacing="5">HELLO, WORLD!</text>
      <text x="52" y="141" fill="#F8F0F3" font-family="Arial, sans-serif" font-size="44" font-weight="700" filter="url(#softGlow)">Hina Sadaf</text>
      <rect x="55" y="160" width="240" height="2" rx="1" fill="url(#neon)">
        <animate attributeName="width" values="0;240;200;240" dur="5s" repeatCount="indefinite"/>
      </rect>
      <text x="55" y="191" fill="#E5B5C7" font-family="Arial, sans-serif" font-size="17">Computer Science Student</text>
      <text x="55" y="217" fill="#F8F0F3" font-family="Arial, sans-serif" font-size="16">Full-Stack Web Developer</text>
      <g font-family="monospace" font-size="12" fill="#C77B9B" opacity="0.9">
        <text x="55" y="250">React.js</text>
        <circle cx="116" cy="246" r="2" fill="#E5B5C7"/>
        <text x="129" y="250">Node.js</text>
        <circle cx="191" cy="246" r="2" fill="#E5B5C7"/>
        <text x="204" y="250">JavaScript</text>
      </g>
      <text x="55" y="275" fill="#F8F0F3" font-family="Arial, sans-serif" font-size="11" letter-spacing="4">LEARN  •  BUILD  •  GROW</text>
    </g>

    <rect x="1" y="1" width="898" height="278" rx="21" fill="none" stroke="#C77B9B" stroke-opacity="0.65"/>
    <rect x="1" y="1" width="898" height="278" rx="21" fill="none" stroke="#E5B5C7" stroke-opacity="0.3" stroke-dasharray="100 800">
      <animate attributeName="stroke-dashoffset" values="900;0" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
